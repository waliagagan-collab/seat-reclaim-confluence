<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Export</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="row">
      <button id="download" type="button" disabled>Download CSV</button>

    <textarea id="fallback" hidden rows="6" spellcheck="false"></textarea>
    <script src="index.js"></script>
  </body>
</html>
